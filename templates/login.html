{% extends "base.html" %}
{% block contenido %}
<div class="text-center mt-4 mb-4">
  <img src="/static/logo.png" alt="Baterías Tabasco" style="width: 110px; height: 110px; object-fit: contain; background: white; padding: 6px; border-radius: 50%; border: 4px solid #FFD100;">
  <h1 class="fw-black mt-3 mb-1" style="color: #FFD100; font-weight: 900; letter-spacing: 2px; text-shadow: 2px 2px 0 #000;">BATERÍAS TABASCO</h1>
  <p class="text-white-50 mb-0">Inicia sesión para entrar al sistema</p>
</div>
<div class="card p-4 shadow" style="max-width: 420px; margin: 0 auto; border-radius: 16px; border-top: 5px solid #FFD100;">
  {% if error %}
  <div class="alert alert-danger" role="alert">{{ error }}</div>
  {% endif %}
  <form method="POST" action="/login">
    <label class="form-label fw-bold mb-1">Usuario</label>
    <select name="nombre" class="form-select form-select-lg mb-3">
      <option value="admin">admin</option>
      <option value="vendedor">vendedor</option>
    </select>
    <label class="form-label fw-bold mb-1">Contraseña</label>
    <input name="password" type="password" class="form-control form-control-lg mb-4" placeholder="Tu contraseña" required>
    <button class="btn w-100 fw-bold btn-lg" style="background: #FFD100; color: #000; padding: 14px; border-radius: 10px;">ENTRAR</button>
  </form>
  <p class="text-muted text-center mt-3 mb-0" style="font-size: 13px;">Admin: todo. Vendedor: registrar y ver ventas, sin editar ni eliminar.</p>
</div>
{% endblock %}
