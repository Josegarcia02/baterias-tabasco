{% extends "base.html" %}
{% block contenido %}

<div class="text-center mt-3 mb-4">
  <img src="/static/logo.png" alt="Baterías Tabasco" style="width: 120px; height: 120px; object-fit: contain; background: white; padding: 6px; border-radius: 50%; border: 4px solid #FFD100;">
  <h1 class="fw-black mt-3 mb-1" style="color: #FFD100; font-weight: 900; letter-spacing: 2px; text-shadow: 2px 2px 0 #000;">BATERÍAS TABASCO</h1>
  <p class="text-white-50 mb-0">Villahermosa, Tabasco &bull; Sistema de ventas y garantías</p>
</div>

<div class="card p-4 shadow" style="max-width: 560px; margin: 0 auto; border-radius: 16px; border-top: 5px solid #FFD100;">
  <h2 class="h5 fw-bold mb-3">📝 Registrar venta</h2>
  <form method="POST" action="/vender">
    <label class="form-label fw-bold mb-1">Nombre del cliente</label>
    <input name="nombre" class="form-control form-control-lg mb-3" placeholder="Ej: José García" required>

    <label class="form-label fw-bold mb-1">Teléfono / WhatsApp</label>
    <input name="telefono" type="tel" class="form-control form-control-lg mb-3" placeholder="Ej: 9931234567" required>

    <label class="form-label fw-bold mb-1">Cantidad de baterías</label>
    <input name="cantidad" id="cantidad" type="number" min="1" step="1" value="1" class="form-control form-control-lg mb-3" required>

    <div id="items"></div>
    <p class="fw-bold mb-3" style="font-size: 18px;">Total: <span id="total">$0.00</span></p>
    <script>
      var opciones = '<option value="LTH L-24-530">LTH L-24-530</option><option value="LTH L-34-590">LTH L-34-590</option><option value="LTH L-47-550">LTH L-47-550</option><option value="LTH L-65-800">LTH L-65-800</option><option value="LTH L-35-575">LTH L-35-575</option><option value="DURALAST 65-800">DURALAST 65-800</option><option value="DURALAST 47-600">DURALAST 47-600</option><option value="DURALAST 35-600">DURALAST 35-600</option>';
      function actualizaTotal() {
        var total = 0;
        document.querySelectorAll('.precio-item').forEach(function(el) { total += parseFloat(el.value) || 0; });
        document.getElementById('total').textContent = '$' + total.toLocaleString('es-MX', {minimumFractionDigits: 2});
      }
      function generaItems() {
        var n = parseInt(document.getElementById('cantidad').value) || 1;
        if (n < 1) n = 1;
        var html = '';
        for (var k = 1; k <= n; k++) {
          html += '<div class="border rounded p-3 mb-3" style="background: #f8f9fa;">'
            + '<p class="fw-bold mb-2">Batería ' + k + '</p>'
            + '<label class="form-label fw-bold mb-1">Batería</label>'
            + '<select name="bateria_' + k + '" class="form-select form-select-lg mb-3">' + opciones + '</select>'
            + '<label class="form-label fw-bold mb-1">Precio</label>'
            + '<div class="input-group input-group-lg mb-1"><span class="input-group-text fw-bold">$</span>'
            + '<input name="precio_' + k + '" type="number" min="0" step="0.01" class="form-control precio-item" placeholder="Ej: 1800" required></div>'
            + '</div>';
        }
        document.getElementById('items').innerHTML = html;
        document.querySelectorAll('.precio-item').forEach(function(el) { el.addEventListener('input', actualizaTotal); });
        actualizaTotal();
      }
      document.getElementById('cantidad').addEventListener('input', generaItems);
      generaItems();
    </script>

    <label class="form-label fw-bold mb-1">Garantía</label>
    <select name="garantia" class="form-select form-select-lg mb-4">
      <option value="3">Garantía 3 meses</option>
      <option value="4">Garantía 4 meses</option>
      <option value="6">Garantía 6 meses</option>
      <option value="12">Garantía 12 meses</option>
    </select>

    <button class="btn w-100 fw-bold btn-lg" style="background: #FFD100; color: #000; padding: 14px; border-radius: 10px;">💾 GUARDAR VENTA</button>
  </form>
</div>

<p class="text-center text-white-50 mt-3" style="font-size: 13px;">Al guardar, la venta aparece en Ventas y ya puedes imprimir su nota con folio y QR.</p>

{% endblock %}
